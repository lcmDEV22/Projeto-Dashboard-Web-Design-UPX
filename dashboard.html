<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Consumo</title>

    <!--Liga o html com o CSS-->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard">

    <!-- Organiza a navegação lateral e o conteúdo principal do dashboard. -->
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" aria-label="Navegação do dashboard">
            <a class="sidebar-brand" href="dashboard.html">Consumo</a>
            <p class="sidebar-caption">PAINEL</p>
            <nav class="sidebar-nav" aria-label="Gráficos disponíveis">
                <button class="sidebar-link is-active" type="button" data-chart-target="secaoGraficoMensal" aria-controls="secaoGraficoMensal" aria-pressed="true">
                    <span class="sidebar-link-icon" aria-hidden="true">M</span>
                    Consumo mensal
                </button>
                <button class="sidebar-link" type="button" data-chart-target="secaoGraficoDiario" aria-controls="secaoGraficoDiario" aria-pressed="false">
                    <span class="sidebar-link-icon" aria-hidden="true">D</span>
                    Consumo diário
                </button>
            </nav>
            <div class="sidebar-export">
                <p class="sidebar-caption">DADOS</p>
                <button class="btn-exportar" id="btnExportarHistorico" type="button">
                    <span aria-hidden="true">↓</span>
                    Exportar histórico
                </button>
                <p id="statusExportacao" class="export-status" role="status" aria-live="polite"></p>
            </div>
        </aside>

        <main class="dashboard-main">
            <!-- Início do conteúdo principal do dashboard. -->
            <div class="dashboard-container">
                <header class="dashboard-header">
                    <div>
                        <h1>Dashboard</h1>
                        <h2>Painel de Controle</h2>
                    </div>
                    <div class="dashboard-actions">
                        <p>Olá, <span id="usuarioLogado"></span></p>
                        <button class="btn-atualizar" id="btnAtualizarDados" type="button">Atualizar</button>
                        <button class="btn-sair" id="btnSair" type="button">Sair</button>
                    </div>
                </header>

                <!-- Informa se os dados são reais, demonstrativos ou se houve falha na API. -->
                <p id="statusApi" class="api-status" role="status" aria-live="polite"></p>

                <!-- Indicadores resumidos do consumo. -->
                <section class="cards-grid">
                    <div class="card">
                        <span class="card-title">Custo total</span>
                        <strong id="cardCustoTotal">--</strong>
                        <small id="variacaoCustoTotal">Período selecionado</small>
                    </div>
                    <div class="card">
                        <span class="card-title">Consumo Diário</span>
                        <strong id="cardConsumoDiario">--</strong>
                        <small id="variacaoConsumoDiario">--</small>
                    </div>
                    <div class="card">
                        <span class="card-title">Consumo Mensal</span>
                        <strong id="cardConsumoMensal">--</strong>
                        <small id="variacaoConsumoMensal">--</small>
                    </div>
                </section>
            </div>

            <!-- Cada painel é exibido pela seleção correspondente na barra lateral. -->
            <section class="chart-panel" id="secaoGraficoMensal" aria-labelledby="tituloGraficoMensal">
                <h2 id="tituloGraficoMensal">Consumo Mensal</h2>
                <!-- Permite trocar a grandeza exibida no gráfico mensal. -->
                <div class="chart-toolbar">
                    <label for="grandezaGraficoMensal">
                        <select id="grandezaGraficoMensal" class="seletor-grandeza">
                            <option value="consumo">Consumo (kWh)</option>
                            <option value="tensao">Tensão (V)</option>
                            <option value="corrente">Corrente (A)</option>
                            <option value="potencia">Potência (W)</option>
                        </select>
                    </label>
                </div>
                <div class="grafico-wrapper">
                    <canvas id="meuGrafico" aria-label="Gráfico de consumo mensal"></canvas>
                    <div id="tooltipGraficoMensal" class="tooltip-grafico" role="status" aria-live="polite" hidden></div>
                </div>
            </section>

            <section class="chart-panel" id="secaoGraficoDiario" aria-labelledby="tituloGraficoDiario" hidden>
                <h2 id="tituloGraficoDiario">Consumo Diário</h2>
                <!-- Filtros que definem o mês e o ano representados no gráfico diário. -->
                <div class="filtros-diarios">
                    <label for="filtroMesDiario">Mês
                        <select id="filtroMesDiario"></select>
                    </label>
                    <label for="filtroAnoDiario">Ano
                        <select id="filtroAnoDiario"></select>
                    </label>
                    <!-- Mantém a grandeza alinhada aos filtros de mês e ano. -->
                    <label class="filtro-grandeza" for="grandezaGraficoDiario">
                        <select id="grandezaGraficoDiario" class="seletor-grandeza">
                            <option value="consumo">Consumo (kWh)</option>
                            <option value="tensao">Tensão (V)</option>
                            <option value="corrente">Corrente (A)</option>
                            <option value="potencia">Potência (W)</option>
                        </select>
                    </label>
                </div>
                <div class="grafico-wrapper">
                    <canvas id="meuGrafico2" aria-label="Gráfico de consumo diário"></canvas>
                    <div id="tooltipGraficoDiario" class="tooltip-grafico" role="status" aria-live="polite" hidden></div>
                </div>
            </section>
        </main>
    </div>

    <script src="api-config.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>

</body>

</html>
