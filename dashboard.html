<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Consumo</title>

    <!--Liga o html com o CSS-->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard">

    <!--Inicio da Dashboard-->

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>Dashboard</h1>
                <h2>Painel de Controle</h2>
            </div>
            <div class="dashboard-actions">
                <p>Olá, <span id="usuarioLogado"></span></p>
                <button class="btn-sair" id="btnSair" type="button">Sair</button>
            </div>
        </header>

        <!--Indicador em card-->

        <section class="cards-grid">

            <div class="card">
                <span class="card-title">Total de Consumo</span>
                <strong>R$ xx.xxx,xx</strong>
                <small>+xx,x% este mês</small>
            </div>

            <div class="card">
                <span class="card-title">Consumo Diário</span>
                <strong>x.xxx</strong>
                <small>+xx,x% este mês</small>
            </div>

            <div class="card">
                <span class="card-title">Consumo Mensal</span>
                <strong>x.xxx</strong>
                <small>+xx,x% este mês</small>
            </div>

        </section>
    </div>

    <!--Container gráfico-->

    <section>
        <h2>Consumo Mensal</h2>
        <!-- Wrapper que ancora o tooltip mensal ao canvas em qualquer largura. -->
        <div class="grafico-wrapper">
            <canvas id="meuGrafico" aria-label="Gráfico de consumo mensal"></canvas>
            <div id="tooltipGraficoMensal" class="tooltip-grafico" role="status" aria-live="polite" hidden></div>
        </div>
    </section>

    <section>
        <h2>Consumo Diário</h2>
        <!-- Filtros que definem o mês e o ano representados no gráfico diário. -->
        <div class="filtros-diarios">
            <label for="filtroMesDiario">Mês
                <select id="filtroMesDiario"></select>
            </label>
            <label for="filtroAnoDiario">Ano
                <select id="filtroAnoDiario"></select>
            </label>
        </div>
        <!-- Mantém o tooltip ancorado ao gráfico mesmo quando o layout muda de tamanho. -->
        <div class="grafico-wrapper">
            <canvas id="meuGrafico2" aria-label="Gráfico de consumo diário"></canvas>
            <div id="tooltipGraficoDiario" class="tooltip-grafico" role="status" aria-live="polite" hidden></div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="auth.js"></script>

</body>

</html>
