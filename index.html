<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta para entrar no painel do projeto.">
    <meta name="robots" content="noindex, follow">
    <title>Entrar na conta | Painel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="Login">
    <main class="login-form">
        <h1 class="h2-login">Entrar na conta</h1>
        <form action="dashboard.html" method="post">
            <div class="input-login-form">
                <label class="sr-only" for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Usuário" autocomplete="username" required>
            </div>
            <div class="input-login-form">
                <label class="sr-only" for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
            </div>
            <input type="submit" value="Entrar" class="btn-entrar">
        </form>
        <p class="auth-link">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </main>
</body>

</html>
